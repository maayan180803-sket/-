        // מיפוי אותיות עבריות לערכים נומרולוגיים
        const hebrewValues = {
            'א': 1, 'ב': 2, 'ג': 3, 'ד': 4, 'ה': 5, 'ו': 6, 'ז': 7, 'ח': 8, 'ט': 9,
            'י': 10, 'כ': 20, 'ל': 30, 'מ': 40, 'נ': 50, 'ס': 60, 'ע': 70, 'פ': 80, 'צ': 90,
            'ק': 100, 'ר': 200, 'ש': 300, 'ת': 400, 'ך': 20, 'ם': 40, 'ן': 50, 'ף': 80, 'ץ': 90
        };

        // אותיות אהו"י
        const vowels = ['א', 'ה', 'ו', 'י', 'ע'];
        
        // עיצורים
        const consonants = ['ב', 'ג', 'ד', 'ז', 'ח', 'ט', 'כ', 'ל', 'מ', 'נ', 'ס', 'פ', 'צ', 'ק', 'ר', 'ש', 'ת', 'ך', 'ם', 'ן', 'ף', 'ץ'];

        function reduceToSingleDigit(num) {
            // בדיקה לחובות קארמתיים לפני צמצום
            const karmicDebts = [13, 14, 16, 19];
            if (karmicDebts.includes(num)) {
                const reduced = num.toString().split('').reduce((sum, digit) => sum + parseInt(digit), 0);
                return ${num}/${reduced};
            }
            
            while (num > 9 && num !== 11 && num !== 22 && num !== 33) {
                num = num.toString().split('').reduce((sum, digit) => sum + parseInt(digit), 0);
            }
            return num;
        }

        function calculateNameValue(name) {
            return name.split('').reduce((sum, char) => {
                return sum + (hebrewValues[char] || 0);
            }, 0);
        }

        function calculateVowels(name) {
            return name.split('').reduce((sum, char) => {
                return vowels.includes(char) ? sum + (hebrewValues[char] || 0) : sum;
            }, 0);
        }

        function calculateConsonants(name) {
            return name.split('').reduce((sum, char) => {
                return consonants.includes(char) ? sum + (hebrewValues[char] || 0) : sum;
            }, 0);
        }

        function calculateLifePath(birthDate) {
            const date = new Date(birthDate);
            const day = date.getDate();
            const month = date.getMonth() + 1;
            const year = date.getFullYear();
            
            const sum = day + month + year;
            return reduceToSingleDigit(sum);
        }

        function calculateBirthDay(birthDate) {
            const date = new Date(birthDate);
            return reduceToSingleDigit(date.getDate());
        }

        function calculatePersonData(firstName, lastName, birthDate) {
            const fullName = firstName + lastName;
            
            return {
                firstName: reduceToSingleDigit(calculateNameValue(firstName)),
                fullName: reduceToSingleDigit(calculateNameValue(fullName)),
                vowels: reduceToSingleDigit(calculateVowels(fullName)),
                consonants: reduceToSingleDigit(calculateConsonants(fullName)),
                lifePath: calculateLifePath(birthDate),
                birthDay: calculateBirthDay(birthDate)
            };
        }

        function calculateCombinedResults(person1, person2) {
            const combined = {};
            const details = {};

            Object.keys(person1).forEach(key => {
                // המרת מחרוזות חזרה למספרים לחישוב
                const val1 = typeof person1[key] === 'string' ? parseInt(person1[key].split('/')[1] || person1[key]) : person1[key];
                const val2 = typeof person2[key] === 'string' ? parseInt(person2[key].split('/')[1] || person2[key]) : person2[key];
                
                const sum = val1 + val2;
                combined[key] = reduceToSingleDigit(sum);
                
                details[key] = {
                    person1: person1[key],
                    person2: person2[key],
                    combined: combined[key]
                };
            });

            return {
                combined: combined,
                details: details
            };
        }

        function displayResults(person1, person2, results) {
            const resultsDiv = document.getElementById('results');

            // תוצאות מחוברות
            const categoryNames = {
                firstName: "שם פרטי",
                fullName: "שם מלא", 
                vowels: "אהו״י",
                consonants: "עיצורים",
                lifePath: "שביל גורל",
                birthDay: "יום לידה"
            };

            document.getElementById('combinedResults').innerHTML = Object.keys(results.combined).map(key => {
                const detail = results.details[key];
                return `
                    <div class="bg-gradient-to-br from-purple-100 to-pink-100 rounded-lg p-4 text-center">
                        <div class="font-medium text-gray-800 mb-2">${categoryNames[key]}</div>
                        <div class="text-sm text-gray-600 mb-2">${detail.person1} + ${detail.person2}</div>
                        <div class="text-2xl font-bold text-purple-700">${detail.combined}</div>
                    </div>
                `;
            }).join('');

            // פירוט אישי
            document.getElementById('person1Results').innerHTML = Object.keys(person1).map(key => 
                <div class="flex justify-between"><span>${categoryNames[key]}:</span><span class="font-semibold">${person1[key]}</span></div>
            ).join('');

            document.getElementById('person2Results').innerHTML = Object.keys(person2).map(key => 
                <div class="flex justify-between"><span>${categoryNames[key]}:</span><span class="font-semibold">${person2[key]}</span></div>
            ).join('');

            // פירוט חישובים
            document.getElementById('compatibilityDetails').innerHTML = Object.keys(results.details).map(key => {
                const detail = results.details[key];
                return `
                    <div class="bg-gray-50 rounded-lg p-3">
                        <div class="font-medium text-gray-800">${categoryNames[key]}</div>
                        <div class="text-sm text-gray-600">${detail.person1} + ${detail.person2} = ${detail.combined}</div>
                    </div>
                `;
            }).join('');

            // המלצות לעבודה
            const recommendations = getWorkRecommendations(results.combined);
            document.getElementById('recommendations').innerHTML = recommendations.join('<br><br>') + 
                '<br><br><div style="background: #f3f4f6; padding: 12px; border-radius: 8px; margin-top: 16px;"><strong>📚 הסבר על סוגי המספרים:</strong><br>' +
                '✨ <strong>מספרי מאסטר (11, 22, 33):</strong> מספרים בעלי עוצמה רוחנית גבוהה הנושאים אחריות ופוטנציאל מיוחד<br>' +
                '🌀 <strong>מספרים ללא שיעור (10, 12):</strong> מספרים המייצגים אתגרים ללא מגבלות ודורשים גישה פתוחה ומיוחדת<br>' +
                '⚡ <strong>חובות קארמתיים (13/4, 14/5, 16/7, 19/1):</strong> מספרים המייצגים שיעורים קארמתיים שצריך לתקן מחיים קודמים. דורשים עבודה מיוחדת ומודעות</div>';

            resultsDiv.classList.remove('hidden');

        function calculateCompatibility() {
            try {
                const firstName1 = document.getElementById('firstName1').value.trim();
                const lastName1 = document.getElementById('lastName1').value.trim();
                const birthDate1 = document.getElementById('birthDate1').value;
                
                const firstName2 = document.getElementById('firstName2').value.trim();
                const lastName2 = document.getElementById('lastName2').value.trim();
                const birthDate2 = document.getElementById('birthDate2').value;

                if (!firstName1 || !lastName1 || !birthDate1 || !firstName2 || !lastName2 || !birthDate2) {
                    alert('אנא מלא את כל השדות');
                    return;
                }

                const person1 = calculatePersonData(firstName1, lastName1, birthDate1);
                const person2 = calculatePersonData(firstName2, lastName2, birthDate2);
                const results = calculateCombinedResults(person1, person2);

                displayResults(person1, person2, results);
            } catch (error) {
                console.log('Error:', error);
                alert('אירעה שגיאה. אנא נסה שוב.');
            }
        }

        // הוספת event listener כשהדף נטען
        document.addEventListener('DOMContentLoaded', function() {
            const button = document.querySelector('button');
            if (button) {
                button.addEventListener('click', calculateCompatibility);
            }
        });
